services:
  db:
    image: timescale/timescaledb:2.26.3-pg16

  tsdb-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1
    container_name: tsdb-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-pasword}@db:5432/${POSTGRES_DB:-md_quiz}?sslmode=disable"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
      PG_EXPORTER_EXCLUDE_DATABASES: "template0,template1"
    ports:
      - "9188:9187"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
