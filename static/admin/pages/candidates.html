<div x-show="route.name === 'candidates'" class="admin-r-workspace admin-r-workspace--split">
  <div x-show="shouldShowAdminCompactTabs('candidates')" x-cloak data-admin-compact-tabs="candidates" class="admin-compact-tabs">
    <div class="admin-compact-tabs__track" role="tablist" aria-label="候选人页面内容切换">
      <template x-for="tab in adminCompactTabs('candidates')" :key="tab.id">
        <button
          type="button"
          role="tab"
          @click="setAdminCompactTab('candidates', tab.id)"
          :class="adminCompactTab('candidates') === tab.id ? 'admin-compact-tab--active' : 'admin-compact-tab--inactive'"
          :aria-selected="String(adminCompactTab('candidates') === tab.id)"
          class="admin-compact-tab"
          x-text="tab.label"
        ></button>
      </template>
    </div>
  </div>

  <section x-show="adminCompactPanelVisible('candidates', 'list')" class="admin-r-surface">
    <header class="admin-r-header">
      <div>
        <h2 class="admin-r-title">候选人</h2>
        <p class="admin-r-subtitle">候选人档案、资料入库和答题记录入口。</p>
      </div>
      <span class="admin-r-pill admin-r-pill--info">
        <span x-text="(candidates.items || []).length"></span>
        <span>人</span>
      </span>
    </header>

    <div class="admin-r-toolbar">
      <label x-data="{ composing: false }" class="admin-r-field flex-1">
        <span>搜索</span>
        <input
          x-model="filters.candidates.q"
          @change="loadCandidates"
          @compositionstart="composing = true"
          @compositionend="composing = false"
          @keydown.enter.prevent="if (!composing) $event.target.blur()"
          class="admin-r-input"
          placeholder="搜索姓名 / 手机号"
        />
      </label>
    </div>

    <div class="overflow-x-auto">
      <div class="admin-r-table-head min-w-[640px] grid-cols-[minmax(12rem,1fr)_7rem_11rem_2rem] gap-3">
        <span>姓名</span>
        <span>资料</span>
        <span>创建时间</span>
        <span></span>
      </div>
      <div class="min-w-[640px]">
        <template x-for="item in candidates.items" :key="item.id">
          <button type="button" @click="go('/admin/candidates/' + item.id)" class="admin-r-row grid-cols-[minmax(12rem,1fr)_7rem_11rem_2rem] items-center gap-3">
            <span class="min-w-0">
              <span class="admin-r-row-title" x-text="item.name"></span>
              <span class="admin-r-row-meta admin-r-code" x-text="item.phone"></span>
            </span>
            <span>
              <span x-show="item.has_resume" class="admin-r-pill admin-r-pill--ok">有简历</span>
              <span x-show="!item.has_resume" class="admin-r-pill">未入库</span>
            </span>
            <span class="admin-r-code tabular-nums" x-text="formatDateTime(item.created_at)"></span>
            <span class="material-symbols-rounded text-[18px] text-slate-400">chevron_right</span>
          </button>
        </template>
      </div>
      <div x-show="!(candidates.items || []).length" class="admin-r-empty">当前没有候选人</div>
    </div>
  </section>

  <aside x-show="adminCompactPanelVisible('candidates', 'create')" class="grid gap-3">
    <section class="admin-r-surface">
      <header class="admin-r-header">
        <div>
          <h2 class="admin-r-title">创建候选人</h2>
          <p class="admin-r-subtitle">手动建档，或从简历自动识别入库。</p>
        </div>
      </header>

      <div class="admin-r-section admin-r-grid">
        <label class="admin-r-field">
          <span>姓名</span>
          <input x-model="candidateForm.name" class="admin-r-input" placeholder="张三" />
        </label>
        <label class="admin-r-field">
          <span>手机号</span>
          <input x-model="candidateForm.phone" class="admin-r-input" placeholder="13800138000" />
        </label>
        <button @click="createCandidate" type="button" class="admin-r-button admin-r-button--primary justify-self-start">
          <span class="material-symbols-rounded text-base">person_add</span>
          创建候选人
        </button>
      </div>
    </section>

    <section class="admin-r-surface">
      <header class="admin-r-header">
        <div>
          <h2 class="admin-r-title">从简历直接入库</h2>
          <p class="admin-r-subtitle">上传 PDF 或图片，系统解析手机号并创建或更新候选人。</p>
        </div>
        <button
          @click="openCandidateResumeUploadPicker"
          type="button"
          :disabled="candidateResumeUploadState.busy"
          class="admin-r-button admin-r-button--soft"
        >
          <span class="material-symbols-rounded text-base" :class="candidateResumeUploadState.busy ? 'animate-spin' : ''" x-text="candidateResumeUploadState.busy ? 'progress_activity' : 'upload_file'"></span>
          <span x-text="candidateResumeUploadState.busy ? '解析中' : '选择简历'"></span>
        </button>
      </header>

      <input x-ref="candidateResumeUpload" @change="handleCandidateResumeUploadSelected($event)" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.bmp,.tif,.tiff" class="sr-only" />

      <div class="admin-r-section">
        <div class="admin-r-card admin-r-card--highlight" :style="resumeStatePanelStyle(candidateResumeUploadState.phase)">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <span class="admin-r-label">当前状态</span>
            <span class="admin-r-pill" :style="resumeStateBadgeStyle(candidateResumeUploadState.phase)" x-text="resumeStateLabel(candidateResumeUploadState.phase)"></span>
          </div>
          <div class="mt-3 text-sm text-slate-700" x-text="candidateResumeUploadState.message"></div>
          <div class="mt-2 break-all text-xs leading-5 text-slate-500">
            <span class="text-slate-600">本次文件：</span>
            <span x-text="candidateResumeUploadState.fileName || '未选择文件'"></span>
          </div>
          <div x-show="candidateResumeUploadState.created !== null" class="mt-2 text-xs leading-5 text-slate-500">
            <span class="text-slate-600">处理结果：</span>
            <span x-text="candidateResumeUploadState.created ? '已创建候选人' : '已更新候选人'"></span>
            <span x-show="candidateResumeUploadState.candidateName" x-text="' · ' + candidateResumeUploadState.candidateName"></span>
          </div>
          <p x-show="candidateResumeUploadState.error" class="mt-2 text-xs leading-5 text-rose-600" x-text="candidateResumeUploadState.error"></p>
        </div>
      </div>
    </section>
  </aside>
</div>
