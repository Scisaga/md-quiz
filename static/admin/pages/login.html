<section class="admin-r-login">
  <div class="admin-r-login__shell">
    <section class="admin-r-login__brand">
      <div>
        <div class="flex items-center gap-3">
          <img src="/static/logo.png" alt="" aria-hidden="true" class="h-12 w-12 shrink-0 rounded-xl bg-blue-600 p-2" />
          <div>
            <div class="text-sm uppercase text-slate-500">MD Quiz</div>
            <h1 class="text-2xl leading-none text-slate-950">后台管理</h1>
          </div>
        </div>
        <div class="mt-12 max-w-xl">
          <div class="text-sm uppercase text-slate-500">Admin Console</div>
          <p class="mt-3 text-4xl leading-tight text-slate-950">测验同步、候选人档案与答题结果的统一工作台。</p>
        </div>
      </div>

      <div class="grid gap-3">
        <div class="admin-r-card admin-r-card--highlight">
          <div class="admin-r-label">服务状态</div>
          <div class="mt-3 inline-flex items-center gap-2 text-lg text-emerald-700">
            <span class="h-2 w-2 rounded-full bg-emerald-500"></span>
            系统正常
          </div>
        </div>
        <div class="grid grid-cols-3 overflow-hidden rounded-xl border border-blue-100 bg-white/72">
          <div class="border-r border-blue-100 p-4">
            <div class="admin-r-label">题库</div>
            <div class="mt-2 text-xl text-slate-950">Git</div>
          </div>
          <div class="border-r border-blue-100 p-4">
            <div class="admin-r-label">权限</div>
            <div class="mt-2 text-xl text-slate-950">Admin</div>
          </div>
          <div class="p-4">
            <div class="admin-r-label">运行</div>
            <div class="mt-2 text-xl text-slate-950">Ready</div>
          </div>
        </div>
      </div>
    </section>

    <section class="admin-r-login__panel">
      <form @submit.prevent="login" class="w-full max-w-sm">
        <div class="mb-8">
          <div class="inline-flex items-center gap-2 rounded-full border border-blue-100 bg-blue-50 px-3 py-1.5 text-xs text-blue-700">
            <span class="material-symbols-rounded text-sm">shield_person</span>
            后台入口
          </div>
          <h2 class="mt-5 text-2xl text-slate-950">管理员登录</h2>
          <p class="mt-2 text-sm leading-6 text-slate-500">请输入账号与密码继续。</p>
        </div>

        <div class="grid gap-4">
          <label class="admin-r-field">
            <span>用户名</span>
            <input x-model="loginForm.username" class="admin-r-input" placeholder="请输入用户名" autocomplete="username" />
          </label>
          <label class="admin-r-field">
            <span>密码</span>
            <input x-model="loginForm.password" type="password" class="admin-r-input" placeholder="请输入密码" autocomplete="current-password" />
          </label>
        </div>

        <p x-show="error" class="mt-5 admin-r-note border-rose-200 bg-rose-50 text-rose-700" x-text="error"></p>

        <button type="submit" class="mt-6 admin-r-button admin-r-button--primary w-full">
          <span class="material-symbols-rounded text-[18px]">login</span>
          登录
        </button>
      </form>
    </section>
  </div>
</section>
