<div x-show="route.name === 'quiz-detail'" class="admin-r-workspace admin-r-workspace--split">
  <div x-show="shouldShowAdminCompactTabs('quiz-detail')" x-cloak data-admin-compact-tabs="quiz-detail" class="admin-compact-tabs">
    <div class="admin-compact-tabs__track" role="tablist" aria-label="测验详情内容切换">
      <template x-for="tab in adminCompactTabs('quiz-detail')" :key="tab.id">
        <button
          type="button"
          role="tab"
          @click="setAdminCompactTab('quiz-detail', tab.id)"
          :class="adminCompactTab('quiz-detail') === tab.id ? 'admin-compact-tab--active' : 'admin-compact-tab--inactive'"
          :aria-selected="String(adminCompactTab('quiz-detail') === tab.id)"
          class="admin-compact-tab"
          x-text="tab.label"
        ></button>
      </template>
    </div>
  </div>

  <section x-show="adminCompactPanelVisible('quiz-detail', 'content')" class="admin-r-surface">
    <header class="admin-r-header">
      <div class="min-w-0">
        <div class="flex flex-wrap items-center gap-2">
          <h2 class="admin-r-title text-[1.1rem]" x-text="quizDetail.quiz?.title || quizDetail.quiz?.quiz_key"></h2>
          <span class="admin-r-pill admin-r-pill--info" x-text="quizDetail.quiz?.quiz_key"></span>
        </div>
        <div class="mt-2 flex flex-wrap gap-2">
          <span class="admin-r-pill">状态 <span class="ml-1" x-text="quizDetail.quiz?.status"></span></span>
          <span class="admin-r-pill">当前版本 <span class="ml-1" x-text="quizDetail.quiz?.current_version_no || '-'"></span></span>
          <span class="admin-r-pill">题目数 <span class="ml-1" x-text="quizDetail.stats?.total_questions || 0"></span></span>
          <span class="admin-r-pill">预计 <span class="mx-1" x-text="quizDetail.quiz?.estimated_duration_minutes || 0"></span>分钟</span>
          <span class="admin-r-pill">格式 <span class="ml-1" x-text="quizDetail.quiz?.format || '-'"></span></span>
        </div>
      </div>
      <button @click="togglePublicInvite" type="button" class="admin-r-button" :class="quizDetail.quiz?.public_invite_enabled ? 'admin-r-button--soft' : 'admin-r-button--primary'">
        <span x-text="quizDetail.quiz?.public_invite_enabled ? '关闭公开邀约' : '开启公开邀约'"></span>
      </button>
    </header>

    <div class="admin-r-section">
      <div x-show="(quizDetail.quiz?.tags || []).length" class="mb-3 flex flex-wrap gap-2">
        <template x-for="tag in (quizDetail.quiz?.tags || [])" :key="tag">
          <span class="admin-r-pill" x-text="tag"></span>
        </template>
      </div>
      <div class="grid grid-cols-[12rem_minmax(0,1fr)] overflow-hidden rounded-lg border border-blue-100 bg-blue-50/55">
        <div class="border-r border-blue-100 p-4">
          <div class="admin-r-label">总分</div>
          <div class="admin-r-value tabular-nums" x-text="quizDetail.stats?.total_points || 0"></div>
        </div>
        <div class="p-4">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div class="admin-r-label">Traits 维度</div>
            <span class="admin-r-pill"><span x-text="traitDimensions().length"></span> 个维度</span>
          </div>
          <div class="mt-3 flex flex-wrap gap-2">
            <template x-for="dimension in traitDimensions()" :key="dimension.name">
              <span :style="traitBadgeStyle(dimension.name)" class="inline-flex items-center gap-2 rounded-full border px-3 py-1 text-xs">
                <span :style="traitDotStyle(dimension.name)" class="h-2 w-2 rounded-full"></span>
                <span x-text="dimension.name"></span>
              </span>
            </template>
          </div>
        </div>
      </div>
    </div>

    <section x-show="quizDetail.quiz?.public_invite_enabled && quizDetail.quiz?.public_invite_url" class="admin-r-section admin-public-invite">
      <div class="admin-public-invite__main">
        <div class="min-w-0 flex-1">
          <div class="admin-r-label">公开链接</div>
          <div class="admin-public-invite__controls">
            <div class="admin-public-invite__material-group" role="radiogroup" aria-label="公开邀约资料采集">
              <template x-for="option in publicInviteMaterialOptions()" :key="option.value">
                <button type="button" role="radio" @click="setPublicInviteMaterialMode(option.value)" :aria-checked="String(publicInviteMaterialMode() === option.value)" :class="publicInviteMaterialButtonClass(option.value)" class="admin-public-invite__control admin-public-invite__material-control" x-text="option.label"></button>
              </template>
            </div>
            <button type="button" role="switch" @click="setPublicInviteIgnoreTiming(!publicInviteIgnoreTiming())" :aria-checked="String(publicInviteIgnoreTiming())" :class="publicInviteIgnoreTimingButtonClass()" class="admin-public-invite__control">
              <span class="material-symbols-rounded admin-public-invite__control-icon" x-text="publicInviteIgnoreTiming() ? 'timer_off' : 'timer'"></span>
              <span>忽略计时</span>
            </button>
          </div>
          <a :href="quizDetail.quiz?.public_invite_url" target="_blank" rel="noreferrer" class="admin-public-invite__link" x-text="quizDetail.quiz?.public_invite_url"></a>
        </div>
        <button x-show="quizDetail.quiz?.public_invite_qr_url" type="button" @click="copyAssignmentQr({ qr_url: quizDetail.quiz?.public_invite_qr_url })" class="admin-public-invite__qr-button" title="点击复制二维码" aria-label="点击复制公开邀约二维码">
          <img :src="quizDetail.quiz?.public_invite_qr_url" alt="公开邀约二维码" class="admin-public-invite__qr-image" />
        </button>
      </div>
    </section>

    <section class="admin-r-section">
      <div class="flex flex-wrap items-end justify-between gap-3">
        <div>
          <div class="admin-r-label">测验浏览</div>
          <h3 class="admin-r-title mt-1">当前选择版本</h3>
        </div>
        <div class="flex flex-wrap gap-2">
          <template x-for="(count, type) in (quizDetail.stats?.counts_by_type || {})" :key="type">
            <span class="admin-r-pill">
              <span x-text="questionTypeLabel(type)"></span>
              <span class="ml-1" x-text="count + ' 题'"></span>
            </span>
          </template>
        </div>
      </div>

      <div x-show="quizQuestions().length" class="mt-4 grid gap-3">
        <template x-for="(question, index) in quizQuestions()" :key="question.qid || index">
          <article class="overflow-hidden rounded-lg border border-blue-100 bg-white">
            <header class="flex items-center justify-between gap-3 border-b border-blue-100 bg-blue-50/45 px-4 py-3">
              <div class="flex min-w-0 items-center gap-2">
                <span class="text-sm text-slate-900" x-text="question.label || question.qid || ('Q' + (index + 1))"></span>
                <span class="admin-r-pill admin-r-pill--info" x-text="questionTypeLabel(question.type)"></span>
                <span class="admin-r-pill"><span x-text="(question.max_points || 0) + ' 分'"></span></span>
              </div>
              <div x-show="Number(question.answer_time_seconds || 0) > 0" class="font-sans text-[12px] font-normal leading-5 tracking-normal text-slate-500 tabular-nums" x-text="'答题用时 ' + formatAnswerTime(question.answer_time_seconds)"></div>
            </header>
            <div class="px-4 py-3">
              <div class="quiz-rich admin-markdown text-sm leading-6 text-slate-800" x-html="question.stem_html || ''"></div>
              <template x-if="(question.options || []).length">
                <div class="mt-3 overflow-hidden rounded-lg border border-blue-100 divide-y divide-blue-100">
                  <template x-for="option in (question.options || [])" :key="`${question.qid || index}-${option.key || option.text || ''}`">
                    <div :class="quizOptionRowClass(question, option)" class="flex items-center gap-2.5 px-3 py-2.5">
                      <span class="inline-flex h-6 min-w-6 shrink-0 items-center justify-center rounded-lg border border-blue-100 bg-white px-1.5 text-[11px] text-blue-700" x-text="option.key || '-'"></span>
                      <div class="quiz-rich admin-markdown min-w-0 flex-1 text-sm leading-5 text-slate-700" x-html="option.text_html || ''"></div>
                      <span x-show="!quizQuestionIsCompletion(question) && option.correct" class="admin-r-pill admin-r-pill--ok">正确</span>
                    </div>
                  </template>
                </div>
              </template>
              <template x-if="question.rubric">
                <details class="mt-3 overflow-hidden rounded-lg border border-slate-200 bg-slate-50/80">
                  <summary class="cursor-pointer px-3.5 py-2.5 text-[13px] text-slate-700">评分标准</summary>
                  <div class="quiz-rich admin-markdown border-t border-slate-200 px-3.5 py-2.5 text-[11px] leading-5 text-slate-600" x-html="question.rubric_html || ''"></div>
                </details>
              </template>
            </div>
          </article>
        </template>
      </div>
      <div x-show="!quizQuestions().length" class="admin-r-empty">当前版本暂无可预览题目</div>
    </section>
  </section>

  <aside x-show="adminCompactPanelVisible('quiz-detail', 'history')" class="admin-r-surface">
    <header class="admin-r-header">
      <div>
        <h2 class="admin-r-title">版本历史</h2>
        <p class="admin-r-subtitle">点击切换浏览不同版本。</p>
      </div>
      <span class="admin-r-pill admin-r-pill--info"><span x-text="(quizDetail.quiz_version_history || []).length"></span> 个版本</span>
    </header>
    <div>
      <template x-for="version in quizDetail.quiz_version_history || []" :key="version.id">
        <button type="button" @click="loadQuizVersion(version.id)" class="admin-r-row grid-cols-[minmax(0,1fr)_auto] items-start gap-3" :class="version.is_selected ? 'bg-blue-50/65' : ''">
          <span class="min-w-0">
            <span class="admin-r-row-title">版本 <span x-text="version.version_no || version.id"></span></span>
            <span class="admin-r-row-meta admin-r-code" x-text="version.git_commit || '-'"></span>
            <span class="mt-2 block break-all text-xs leading-5 text-slate-500" x-show="version.source_path" x-text="version.source_path"></span>
            <span class="mt-1 block admin-r-code" x-show="version.created_at" x-text="formatDateTime(version.created_at)"></span>
          </span>
          <span class="material-symbols-rounded text-slate-400" x-text="version.is_selected ? 'visibility' : 'chevron_right'"></span>
        </button>
      </template>
      <div x-show="!(quizDetail.quiz_version_history || []).length" class="admin-r-empty">暂无版本历史</div>
    </div>
  </aside>
</div>
