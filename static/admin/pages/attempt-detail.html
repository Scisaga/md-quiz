<div x-show="route.name === 'attempt-detail'" class="admin-r-workspace admin-r-workspace--wide">
  <div x-show="shouldShowAdminCompactTabs('attempt-detail')" x-cloak data-admin-compact-tabs="attempt-detail" class="admin-compact-tabs">
    <div class="admin-compact-tabs__track" role="tablist" aria-label="答题详情内容切换">
      <template x-for="tab in adminCompactTabs('attempt-detail')" :key="tab.id">
        <button
          type="button"
          role="tab"
          @click="setAdminCompactTab('attempt-detail', tab.id)"
          :class="adminCompactTab('attempt-detail') === tab.id ? 'admin-compact-tab--active' : 'admin-compact-tab--inactive'"
          :aria-selected="String(adminCompactTab('attempt-detail') === tab.id)"
          class="admin-compact-tab"
          x-text="tab.label"
        ></button>
      </template>
    </div>
  </div>

  <section x-show="adminCompactPanelVisible('attempt-detail', 'review')" class="admin-r-surface">
    <header class="admin-r-header">
      <div class="min-w-0">
        <h2 class="admin-r-title">答题回放</h2>
        <p class="admin-r-subtitle">题干、作答、正确答案和评分理由。</p>
        <div class="mt-2 flex flex-wrap items-center gap-2">
          <span :class="assignmentSourceBadgeClass(attemptDetail.quiz_paper)" :aria-label="assignmentSourceLabel(attemptDetail.quiz_paper)">
            <span class="admin-r-pill__icon material-symbols-rounded" aria-hidden="true" x-text="assignmentSourceIcon(attemptDetail.quiz_paper)"></span>
            <span x-text="assignmentSourceLabel(attemptDetail.quiz_paper)"></span>
          </span>
          <span :class="assignmentStatusBadgeClass(attemptDetail.quiz_paper)" x-text="attemptDetail.quiz_paper?.status_label || '状态未知'"></span>
          <span x-show="assignmentIgnoresTiming(attemptDetail.quiz_paper)" class="admin-r-pill admin-r-pill--warn">已忽略计时</span>
          <span x-show="canToggleAssignmentHandling(attemptDetail.quiz_paper)" :class="assignmentHandlingBadgeClass(attemptDetail.quiz_paper)" x-text="assignmentHandlingLabel(attemptDetail.quiz_paper)"></span>
        </div>
        <div x-show="assignmentHandledMeta(attemptDetail.quiz_paper)" class="mt-2 text-[11px] text-slate-500" x-text="'处理人：' + assignmentHandledMeta(attemptDetail.quiz_paper)"></div>
      </div>
      <div class="flex flex-wrap gap-2" role="group" aria-label="答题实例操作">
        <button x-show="canToggleAssignmentHandling(attemptDetail.quiz_paper)" @click="toggleAssignmentHandling(attemptDetail.quiz_paper)" type="button" :class="assignmentActionButtonClass('handling', attemptDetail.quiz_paper)" x-text="assignmentHandlingActionLabel(attemptDetail.quiz_paper)"></button>
        <button x-show="canDeleteAssignment(attemptDetail.quiz_paper)" @click="deleteAssignment(attemptDetail.quiz_paper)" type="button" :class="assignmentActionButtonClass('danger', attemptDetail.quiz_paper)">
          <span class="assignment-action__icon material-symbols-rounded" aria-hidden="true">delete</span>
          <span class="assignment-action__text">删除邀约</span>
        </button>
      </div>
    </header>

    <div x-show="attemptReviewAnswers().length" class="admin-r-section grid gap-3">
      <template x-for="(question, index) in attemptReviewAnswers()" :key="question.qid || index">
        <article class="admin-r-review-question">
          <header class="admin-r-review-question__header">
            <div class="admin-r-review-question__meta">
              <span class="admin-r-review-question__label" x-text="question.label || question.qid || ('Q' + (index + 1))"></span>
              <span class="admin-r-review-chip admin-r-review-chip--info" x-text="questionTypeLabel(question.type)"></span>
              <span x-show="question.has_score" class="admin-r-review-chip admin-r-review-chip--neutral" x-text="question.score_display"></span>
              <span :class="attemptReviewQuestionStatusClass(question)" x-text="attemptReviewQuestionStatusLabel(question)"></span>
            </div>
            <div class="admin-r-review-question__points" x-show="Number(question.max_points || 0) > 0" x-text="'满分 ' + Number(question.max_points || 0) + ' 分'"></div>
          </header>

          <div class="admin-r-review-question__body">
            <div class="quiz-rich admin-markdown admin-r-review-stem" x-html="question.stem_html || ''"></div>

            <template x-if="attemptReviewHasOptions(question)">
              <div class="admin-r-review-options">
                <template x-for="option in (question.options || [])" :key="`${question.qid || index}-${option.key || option.text || ''}`">
                  <div :class="attemptReviewOptionRowClass(question, option)">
                    <span class="admin-r-review-option-key" x-text="option.key || '-'"></span>
                    <div class="min-w-0 flex-1">
                      <div class="quiz-rich admin-markdown admin-r-review-option-text" x-html="option.text_html || ''"></div>
                    </div>
                    <div class="admin-r-review-option-tags">
                      <span x-show="attemptReviewIsObjectiveQuestion(question) && attemptReviewOptionIsCorrect(question, option)" class="admin-r-review-option-badge admin-r-review-option-badge--ok">正确答案</span>
                      <span x-show="attemptReviewOptionIsSelected(question, option)" :class="attemptReviewOptionSelectionBadgeClass(question, option)">候选人选择</span>
                    </div>
                  </div>
                </template>
              </div>
            </template>

            <template x-if="attemptReviewIsShortQuestion(question)">
              <div class="mt-3 grid gap-3">
                <div class="overflow-hidden rounded-lg border border-slate-200 bg-slate-50/85">
                  <div class="border-b border-slate-200 px-3.5 py-2 text-[12px] text-slate-500">候选人作答</div>
                  <div class="whitespace-pre-wrap px-3.5 py-3 text-sm leading-6 text-slate-700" x-text="attemptReviewShortAnswerText(question)"></div>
                </div>
                <div x-show="question.reason" class="overflow-hidden rounded-lg border border-blue-100 bg-blue-50/55">
                  <div class="border-b border-blue-100 px-3.5 py-2 text-[12px] text-blue-700">评分理由</div>
                  <div class="whitespace-pre-wrap px-3.5 py-3 text-sm leading-6 text-slate-700" x-text="question.reason"></div>
                </div>
              </div>
            </template>

            <div x-show="!attemptReviewIsShortQuestion(question) && question.reason" class="mt-3 overflow-hidden rounded-lg border border-blue-100 bg-blue-50/55">
              <div class="border-b border-blue-100 px-3.5 py-2 text-[12px] text-blue-700">评分理由</div>
              <div class="whitespace-pre-wrap px-3.5 py-3 text-sm leading-6 text-slate-700" x-text="question.reason"></div>
            </div>

            <template x-if="question.rubric">
              <details class="admin-r-review-rubric">
                <summary>评分标准</summary>
                <div class="quiz-rich admin-markdown admin-r-review-rubric__body" x-html="question.rubric_html || ''"></div>
              </details>
            </template>
          </div>
        </article>
      </template>
    </div>

    <div x-show="!attemptReviewAnswers().length" class="admin-r-empty">
      <div class="text-slate-700">当前暂无可回放的答题内容</div>
      <p class="mt-2 text-sm leading-6 text-slate-500" x-text="assignmentStatusValue(attemptDetail.quiz_paper) === 'grading' ? '系统正在整理判卷结果，完成后会自动展示完整题目回放。' : '请检查该答题是否已生成归档。'"></p>
    </div>
  </section>

  <aside x-show="adminCompactPanelVisible('attempt-detail', 'evaluation')" class="admin-r-surface">
    <header class="admin-r-header">
      <div>
        <h2 class="admin-r-title">智能评价</h2>
        <p class="admin-r-subtitle">总分、主倾向、维度和候选人简评。</p>
      </div>
    </header>

    <div class="admin-r-section admin-r-grid">
      <div class="admin-r-grid admin-r-grid--2">
        <div x-show="attemptEvaluationShowScore()" class="admin-r-kpi">
          <div class="admin-r-label">总分</div>
          <div class="admin-r-value" x-text="attemptReviewEvaluation().score_display || '-'"></div>
        </div>
        <div class="admin-r-kpi">
          <div class="admin-r-label">结果模式</div>
          <div class="mt-2 text-lg text-slate-900" x-text="attemptEvaluationResultModeLabel()"></div>
        </div>
      </div>

      <section x-show="attemptEvaluationPrimaryDimensions().length">
        <div class="admin-r-label">主倾向</div>
        <div class="mt-3 flex flex-wrap gap-2">
          <template x-for="dimension in attemptEvaluationPrimaryDimensions()" :key="dimension">
            <span :style="traitBadgeStyle(dimension)" class="rounded-full border px-3 py-1 text-xs" x-text="dimension"></span>
          </template>
        </div>
      </section>

      <section x-show="attemptEvaluationTraitPairs().length">
        <div class="admin-r-label">维度对照</div>
        <div class="mt-3 divide-y divide-slate-200/80 rounded-lg border border-slate-200 bg-slate-50/70">
          <template x-for="pair in attemptEvaluationTraitPairs()" :key="`${pair.left || ''}-${pair.right || ''}`">
            <div class="px-4 py-3">
              <div class="flex items-start justify-between gap-3">
                <div>
                  <div class="text-sm tabular-nums text-slate-800" x-text="`${pair.left || '-'} ${pair.left_score || 0} / ${pair.right || '-'} ${pair.right_score || 0}`"></div>
                  <div class="mt-1 text-xs leading-5 text-slate-500" x-text="pair.description || '按对立维度对照输出主倾向。'"></div>
                </div>
                <span :style="traitBadgeStyle(pair.winner || '')" class="rounded-full border px-2.5 py-1 text-[11px]" x-text="pair.winner || '-'"></span>
              </div>
            </div>
          </template>
        </div>
      </section>

      <section x-show="!attemptEvaluationTraitPairs().length && attemptEvaluationDimensionList().length">
        <div class="admin-r-label">维度累计</div>
        <div class="mt-3 divide-y divide-slate-200/80 rounded-lg border border-slate-200 bg-slate-50/70">
          <template x-for="item in attemptEvaluationDimensionList()" :key="item.dimension || ''">
            <div class="px-4 py-3">
              <div class="flex items-center justify-between gap-3">
                <span class="text-sm text-slate-800" x-text="item.dimension || '-'"></span>
                <span class="text-sm text-slate-900" x-text="item.score || 0"></span>
              </div>
              <div class="mt-1 text-xs leading-5 text-slate-500" x-text="item.meaning || '当前维度暂无额外说明。'"></div>
            </div>
          </template>
        </div>
      </section>

      <section x-show="attemptReviewEvaluation().final_analysis">
        <div class="admin-r-label text-emerald-800">综合分析</div>
        <div class="mt-2 whitespace-pre-line text-sm leading-6 text-slate-700" x-text="attemptReviewEvaluation().final_analysis"></div>
      </section>

      <section x-show="attemptReviewEvaluation().candidate_remark">
        <div class="admin-r-label text-blue-800">候选人简评</div>
        <div class="mt-2 whitespace-pre-line text-sm leading-6 text-slate-700" x-text="attemptReviewEvaluation().candidate_remark"></div>
      </section>

      <div x-show="assignmentStatusValue(attemptDetail.quiz_paper) === 'grading' && !attemptEvaluationHasContent()" class="admin-r-note border-amber-200 bg-amber-50/70">
        <div class="text-sm text-amber-800">正在判卷</div>
        <p class="mt-2 text-sm leading-6 text-amber-700/90">系统正在汇总题目得分和大模型分析。</p>
      </div>
      <div x-show="assignmentStatusValue(attemptDetail.quiz_paper) !== 'grading' && !attemptEvaluationHasContent()" class="admin-r-note">
        <div class="text-sm text-slate-700">当前暂无评价摘要</div>
        <p class="mt-2 text-sm leading-6 text-slate-500">该记录尚未生成可展示的综合分析。</p>
      </div>
    </div>
  </aside>
</div>
