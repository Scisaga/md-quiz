<div x-show="route.name === 'mcp'" class="admin-r-workspace admin-r-workspace--wide">
  <div x-show="shouldShowAdminCompactTabs('mcp')" x-cloak data-admin-compact-tabs="mcp" class="admin-compact-tabs">
    <div class="admin-compact-tabs__track" role="tablist" aria-label="MCP 内容切换">
      <template x-for="tab in adminCompactTabs('mcp')" :key="tab.id">
        <button
          type="button"
          role="tab"
          @click="setAdminCompactTab('mcp', tab.id)"
          :class="adminCompactTab('mcp') === tab.id ? 'admin-compact-tab--active' : 'admin-compact-tab--inactive'"
          :aria-selected="String(adminCompactTab('mcp') === tab.id)"
          class="admin-compact-tab"
          x-text="tab.label"
        ></button>
      </template>
    </div>
  </div>

  <section x-show="adminCompactPanelVisible('mcp', 'overview')" class="admin-r-surface">
    <header class="admin-r-header">
      <div>
        <h2 class="admin-r-title">MCP 接入摘要</h2>
        <p class="admin-r-subtitle">智能体访问测验、候选人、邀约和系统状态的远程入口。</p>
      </div>
      <span class="admin-r-pill" :class="mcpInfo().enabled ? 'admin-r-pill--ok' : ''" x-text="mcpInfo().enabled ? 'Enabled' : 'Disabled'"></span>
    </header>

    <div class="grid grid-cols-[12rem_minmax(0,1fr)] divide-x divide-blue-100/70 border-b border-blue-100/70">
      <div class="admin-r-section">
        <div class="admin-r-label">传输方式</div>
        <div class="mt-2 text-lg text-slate-900" x-text="mcpInfo().transport || 'streamable-http'"></div>
      </div>
      <div class="admin-r-section">
        <div class="admin-r-label">鉴权</div>
        <div class="mt-2 text-lg text-slate-900" x-text="mcpInfo().auth_scheme || 'bearer'"></div>
        <p class="admin-r-subtitle">远程 HTTP MCP，不复用后台登录态。</p>
      </div>
    </div>

    <div class="admin-r-section">
      <div class="admin-r-label">Bearer Token</div>
      <div class="mt-3 flex overflow-hidden rounded-lg border border-slate-200 bg-white">
        <div class="min-w-0 flex-1 bg-[rgba(24,43,78,0.96)] px-3 py-2.5 admin-r-code leading-6 text-slate-100/92" x-text="mcpAuthTokenDisplay()"></div>
        <button type="button" @click="toggleMcpTokenVisibility" :disabled="!mcpHasAuthToken()" :aria-label="mcpTokenVisibilityLabel()" :title="mcpTokenVisibilityLabel()" class="grid w-11 place-items-center border-l border-slate-200 text-slate-700 transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-50">
          <span class="material-symbols-rounded text-[20px]" x-text="mcpTokenVisibilityIcon()"></span>
        </button>
        <button type="button" @click="copyMcpToken" :disabled="!mcpHasAuthToken()" aria-label="复制 Token" title="复制 Token" class="grid w-11 place-items-center border-l border-slate-200 text-slate-700 transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-50">
          <span class="material-symbols-rounded text-[20px]">content_copy</span>
        </button>
      </div>
    </div>

    <div class="admin-r-section">
      <div class="admin-r-label">MCP 地址</div>
      <div class="mt-2 break-all text-sm leading-6 text-slate-800" x-text="mcpUrl() || '未启用'"></div>
      <div class="mt-4 flex flex-wrap gap-2">
        <button type="button" @click="copyMcpUrl" class="admin-r-button admin-r-button--primary">
          <span class="material-symbols-rounded text-base">content_copy</span>
          复制 MCP 地址
        </button>
        <button type="button" @click="openMcpDocs" class="admin-r-button">
          <span class="material-symbols-rounded text-base">open_in_new</span>
          打开 MCP 文档
        </button>
      </div>
    </div>

    <div class="admin-r-section">
      <div class="admin-r-label">客户端配置</div>
      <div class="mt-3 grid gap-3">
        <template x-for="client in mcpClientConfigs()" :key="client.key">
          <section class="rounded-lg border border-blue-100 bg-slate-50/65">
            <div class="flex items-start justify-between gap-3 border-b border-blue-100/70 px-4 py-3">
              <div class="flex min-w-0 items-center gap-3">
                <span aria-hidden="true" class="block h-11 w-11 shrink-0 bg-contain bg-center bg-no-repeat" :style="{ backgroundImage: `url('${client.icon}')` }"></span>
                <div class="min-w-0">
                  <h3 class="text-sm text-slate-900" x-text="client.label"></h3>
                  <p class="mt-1 text-sm leading-6 text-slate-600" x-text="client.location"></p>
                </div>
              </div>
              <span class="admin-r-pill" x-text="client.format"></span>
            </div>
            <pre class="m-0 max-h-80 overflow-auto bg-[rgba(24,43,78,0.96)] px-4 py-3 text-xs leading-6 text-slate-100/92"><code x-text="client.snippet"></code></pre>
          </section>
        </template>
      </div>
    </div>
  </section>

  <aside x-show="adminCompactPanelVisible('mcp', 'capabilities')" class="admin-r-surface">
    <header class="admin-r-header">
      <div>
        <h2 class="admin-r-title">能力范围与安全规则</h2>
        <p class="admin-r-subtitle">工具分组、脱敏和高危操作约束。</p>
      </div>
    </header>

    <div>
      <template x-for="group in mcpCapabilityGroups" :key="group.key">
        <section class="admin-r-section">
          <div class="flex items-center gap-3">
            <span class="grid h-9 w-9 place-items-center rounded-lg border border-blue-100 bg-blue-50 text-blue-600">
              <span class="material-symbols-rounded text-[20px]" x-text="group.icon"></span>
            </span>
            <div class="text-sm text-slate-900" x-text="group.label"></div>
          </div>
          <div class="mt-3 flex flex-wrap gap-2">
            <template x-for="toolName in group.tools" :key="toolName">
              <span class="admin-r-pill" x-text="toolName"></span>
            </template>
          </div>
        </section>
      </template>
    </div>

    <section class="admin-r-section">
      <div class="admin-r-label text-amber-700">安全规则</div>
      <ul class="mt-3 divide-y divide-amber-200/80 rounded-lg border border-amber-200 bg-amber-50/75">
        <template x-for="rule in mcpSecurityRules" :key="rule">
          <li class="px-4 py-3 text-sm leading-6 text-slate-700" x-text="rule"></li>
        </template>
      </ul>
    </section>

    <section class="admin-r-section">
      <div class="admin-r-label">典型流程</div>
      <ol class="mt-3 divide-y divide-blue-100 rounded-lg border border-blue-100 bg-slate-50/75">
        <template x-for="step in mcpFlowSteps" :key="step">
          <li class="px-4 py-3 text-sm leading-6 text-slate-700" x-text="step"></li>
        </template>
      </ol>
    </section>
  </aside>
</div>
