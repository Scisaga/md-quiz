<div x-show="route.name === 'status'" class="admin-r-workspace admin-r-workspace--wide">
  <div x-show="shouldShowAdminCompactTabs('status')" x-cloak data-admin-compact-tabs="status" class="admin-compact-tabs">
    <div class="admin-compact-tabs__track" role="tablist" aria-label="系统状态内容切换">
      <template x-for="tab in adminCompactTabs('status')" :key="tab.id">
        <button
          type="button"
          role="tab"
          @click="setAdminCompactTab('status', tab.id)"
          :class="adminCompactTab('status') === tab.id ? 'admin-compact-tab--active' : 'admin-compact-tab--inactive'"
          :aria-selected="String(adminCompactTab('status') === tab.id)"
          class="admin-compact-tab"
          x-text="tab.label"
        ></button>
      </template>
    </div>
  </div>

  <section x-show="adminCompactPanelVisible('status', 'summary')" class="admin-r-surface">
    <header class="admin-r-header">
      <div>
        <h2 class="admin-r-title">系统状态摘要</h2>
        <p class="admin-r-subtitle">资源消耗、配置风险和每日新增趋势。</p>
      </div>
      <span class="admin-r-pill admin-r-pill--info" x-text="statusRangeLabel()"></span>
    </header>

    <div class="admin-r-section">
      <div class="admin-r-grid admin-r-grid--2">
        <article class="admin-r-card admin-r-card--highlight">
          <div class="flex items-start justify-between gap-3">
            <div>
              <div class="admin-r-label">LLM tokens</div>
              <div class="admin-r-value tabular-nums" x-text="formatNumber(statusSummary.llm?.used || 0)"></div>
              <div class="admin-r-hint" x-text="'阈值 ' + formatNumber(statusSummary.llm?.limit || 0)"></div>
            </div>
            <span class="admin-r-pill" :class="statusModuleConfigured('llm') ? 'admin-r-pill--ok' : 'admin-r-pill--danger'" x-text="statusModuleConfigured('llm') ? '正常' : '未配置'"></span>
          </div>
          <div x-show="!statusModuleConfigured('llm')" class="mt-3 text-xs leading-5 text-rose-700" x-text="statusModuleMissingText('llm')"></div>
        </article>
        <article class="admin-r-card admin-r-card--highlight">
          <div class="flex items-start justify-between gap-3">
            <div>
              <div class="admin-r-label">短信调用</div>
              <div class="admin-r-value tabular-nums" x-text="formatNumber(statusSummary.sms?.used || 0)"></div>
              <div class="admin-r-hint" x-text="'阈值 ' + formatNumber(statusSummary.sms?.limit || 0)"></div>
            </div>
            <span class="admin-r-pill" :class="statusModuleConfigured('sms') ? 'admin-r-pill--ok' : 'admin-r-pill--danger'" x-text="statusModuleConfigured('sms') ? '正常' : '未配置'"></span>
          </div>
          <div x-show="!statusModuleConfigured('sms')" class="mt-3 text-xs leading-5 text-rose-700" x-text="statusModuleMissingText('sms')"></div>
        </article>
      </div>
    </div>

    <div x-show="statusConfigAlerts().length" class="admin-r-section">
      <div class="rounded-xl border border-rose-200 bg-rose-50/85 p-4 text-sm text-rose-900">
        <div class="admin-r-label text-rose-700">配置提醒</div>
        <div class="mt-2 grid gap-2">
          <template x-for="alert in statusConfigAlerts()" :key="alert.key">
            <div>
              <div class="text-rose-800" x-text="alert.label"></div>
              <div class="mt-1 text-xs leading-5 text-rose-700" x-text="alert.message"></div>
            </div>
          </template>
        </div>
      </div>
    </div>

    <div class="admin-status-daily-table overflow-x-auto">
      <div class="admin-r-table-head admin-status-daily-table__grid">
        <span>日期</span>
        <span class="text-right">测验</span>
        <span class="text-right">邀约</span>
        <span class="text-right">候选人</span>
        <span class="text-right">LLM Tokens</span>
        <span class="text-right">短信</span>
      </div>
      <div>
        <template x-for="item in statusDailyRows()" :key="item.day">
          <div class="admin-r-row admin-status-daily-table__grid">
            <span class="admin-r-code admin-status-daily-table__date" x-text="item.day"></span>
            <span class="admin-status-daily-table__number text-right" :class="Number(item.quizzes_new || 0) === 0 ? 'admin-status-daily-table__number--zero' : ''" x-text="formatNumber(item.quizzes_new)"></span>
            <span class="admin-status-daily-table__number text-right" :class="Number(item.invites_new || 0) === 0 ? 'admin-status-daily-table__number--zero' : ''" x-text="formatNumber(item.invites_new)"></span>
            <span class="admin-status-daily-table__number text-right" :class="Number(item.candidates_new || 0) === 0 ? 'admin-status-daily-table__number--zero' : ''" x-text="formatNumber(item.candidates_new)"></span>
            <span class="admin-status-daily-table__number text-right" :class="Number(item.llm_tokens || 0) === 0 ? 'admin-status-daily-table__number--zero' : ''" x-text="formatNumber(item.llm_tokens)"></span>
            <span class="admin-status-daily-table__number text-right" :class="Number(item.sms_calls || 0) === 0 ? 'admin-status-daily-table__number--zero' : ''" x-text="formatNumber(item.sms_calls)"></span>
          </div>
        </template>
        <div class="admin-r-row admin-status-daily-table__grid border-t border-blue-100 bg-blue-50/75">
          <span class="admin-status-daily-table__total-label text-slate-900">区间合计</span>
          <span class="admin-status-daily-table__number text-right" :class="Number(statusDailyTotals().quizzes_new || 0) === 0 ? 'admin-status-daily-table__number--zero' : ''" x-text="formatNumber(statusDailyTotals().quizzes_new)"></span>
          <span class="admin-status-daily-table__number text-right" :class="Number(statusDailyTotals().invites_new || 0) === 0 ? 'admin-status-daily-table__number--zero' : ''" x-text="formatNumber(statusDailyTotals().invites_new)"></span>
          <span class="admin-status-daily-table__number text-right" :class="Number(statusDailyTotals().candidates_new || 0) === 0 ? 'admin-status-daily-table__number--zero' : ''" x-text="formatNumber(statusDailyTotals().candidates_new)"></span>
          <span class="admin-status-daily-table__number text-right" :class="Number(statusDailyTotals().llm_tokens || 0) === 0 ? 'admin-status-daily-table__number--zero' : ''" x-text="formatNumber(statusDailyTotals().llm_tokens)"></span>
          <span class="admin-status-daily-table__number text-right" :class="Number(statusDailyTotals().sms_calls || 0) === 0 ? 'admin-status-daily-table__number--zero' : ''" x-text="formatNumber(statusDailyTotals().sms_calls)"></span>
        </div>
      </div>
    </div>
  </section>

  <aside x-show="adminCompactPanelVisible('status', 'config')" class="grid gap-3">
    <section class="admin-r-surface">
      <header class="admin-r-header">
        <div>
          <h2 class="admin-r-title">接入摘要</h2>
          <p class="admin-r-subtitle">当前 LLM 与短信认证服务配置。</p>
        </div>
      </header>
      <div class="admin-r-section admin-r-grid">
        <article id="llm-config" class="admin-r-card scroll-mt-24">
          <div class="admin-r-label">当前接入 LLM</div>
          <div class="mt-2 text-sm text-slate-900" x-text="statusSummary.llm?.integration?.title || 'OpenAI 兼容 Responses API'"></div>
          <div class="mt-2 text-sm leading-6 text-slate-600" x-text="statusSummary.llm?.integration?.summary || '模型未设置 · 接口未设置'"></div>
        </article>
        <article id="sms-config" class="admin-r-card scroll-mt-24">
          <div class="admin-r-label">短信认证摘要</div>
          <div class="mt-2 text-sm text-slate-900" x-text="statusSummary.sms?.integration?.title || '阿里云 PNVS 短信认证'"></div>
          <div class="mt-2 text-sm leading-6 text-slate-600" x-text="statusSummary.sms?.integration?.summary || '签名未设置 · 模板未设置 · 接口未设置'"></div>
        </article>
      </div>
    </section>

    <section id="status-thresholds" class="admin-r-surface scroll-mt-24">
      <header class="admin-r-header">
        <div>
          <h2 class="admin-r-title">阈值配置</h2>
          <p class="admin-r-subtitle">用于状态告警和资源观测。</p>
        </div>
      </header>
      <div class="admin-r-section admin-r-grid">
        <label class="admin-r-field">
          <span>LLM token 日阈值</span>
          <input x-model="statusConfig.llm_tokens_limit" class="admin-r-input" />
        </label>
        <label class="admin-r-field">
          <span>短信调用日阈值</span>
          <input x-model="statusConfig.sms_calls_limit" class="admin-r-input" />
        </label>
        <button @click="saveStatusConfig" type="button" class="admin-r-button admin-r-button--primary justify-self-start">保存阈值</button>
      </div>
    </section>
  </aside>
</div>
