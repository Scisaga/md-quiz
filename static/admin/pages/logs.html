<div x-show="route.name === 'logs'" class="admin-r-workspace admin-r-workspace--wide">
  <div x-show="shouldShowAdminCompactTabs('logs')" x-cloak data-admin-compact-tabs="logs" class="admin-compact-tabs">
    <div class="admin-compact-tabs__track" role="tablist" aria-label="系统日志内容切换">
      <template x-for="tab in adminCompactTabs('logs')" :key="tab.id">
        <button
          type="button"
          role="tab"
          @click="setAdminCompactTab('logs', tab.id)"
          :class="adminCompactTab('logs') === tab.id ? 'admin-compact-tab--active' : 'admin-compact-tab--inactive'"
          :aria-selected="String(adminCompactTab('logs') === tab.id)"
          class="admin-compact-tab"
          x-text="tab.label"
        ></button>
      </template>
    </div>
  </div>

  <section x-show="adminCompactPanelVisible('logs', 'list')" class="admin-r-surface">
    <header class="admin-r-header">
      <div>
        <h2 class="admin-r-title">系统日志</h2>
        <p class="admin-r-subtitle">候选人、测验、邀约、判卷和系统事件。</p>
      </div>
      <button @click="loadLogs" type="button" class="admin-r-button admin-r-button--soft">
        <span class="material-symbols-rounded text-[18px]">refresh</span>
        刷新
      </button>
    </header>

    <div class="admin-r-section">
      <div class="admin-r-grid admin-r-grid--4">
        <template x-for="item in logCategoryCards().slice(0, 4)" :key="item.key">
          <div class="admin-r-kpi">
            <div class="flex items-center gap-2">
              <span class="h-2.5 w-2.5 rounded-full" :style="'background-color:' + item.color"></span>
              <span class="admin-r-label" x-text="item.label"></span>
            </div>
            <div class="admin-r-value tabular-nums" x-text="item.count"></div>
            <p class="admin-r-hint" x-text="item.hint"></p>
          </div>
        </template>
      </div>
    </div>

    <div class="overflow-x-auto">
      <div class="admin-r-table-head min-w-[760px] grid-cols-[10rem_8rem_minmax(14rem,1fr)_12rem] gap-4">
        <span>时间</span>
        <span>分类</span>
        <span>事件</span>
        <span>Trace</span>
      </div>
      <div class="min-w-[760px]">
        <template x-for="item in logs.items" :key="item.id">
          <div class="admin-r-row grid-cols-[10rem_8rem_minmax(14rem,1fr)_12rem] items-start gap-4">
            <span class="admin-r-code tabular-nums" x-text="item.at_display"></span>
            <span class="admin-r-pill admin-r-pill--info" x-text="item.type_label"></span>
            <span class="min-w-0">
              <span class="block text-sm leading-6 text-slate-900" x-text="item.detail_text"></span>
              <span class="admin-r-row-meta" x-text="item.actor || ''"></span>
            </span>
            <span class="admin-r-code truncate" x-text="item.trace_id || item.id || '-'"></span>
          </div>
        </template>
      </div>
      <div x-show="!(logs.items || []).length" class="admin-r-empty">当前暂无系统日志</div>
    </div>
  </section>

  <aside x-show="adminCompactPanelVisible('logs', 'trend')" class="grid gap-3">
    <section class="admin-r-surface">
      <header class="admin-r-header">
        <div>
          <h2 class="admin-r-title">分类趋势</h2>
          <p class="admin-r-subtitle">近 30 天日志密度变化。</p>
        </div>
        <span class="admin-r-pill admin-r-pill--info" x-text="logTrendRangeLabel()"></span>
      </header>

      <div class="admin-r-section">
        <template x-if="hasLogTrendData()">
          <div x-ref="logsTrendChart" class="admin-r-chart-dark"></div>
        </template>
        <div x-show="!hasLogTrendData()" class="grid h-72 place-items-center rounded-xl border border-dashed border-blue-100 bg-slate-50/70 px-6 text-center">
          <div>
            <div class="text-sm text-slate-700">近 30 天暂无分类波动</div>
            <p class="mt-2 text-sm leading-6 text-slate-500">产生新日志后会自动恢复折线图。</p>
          </div>
        </div>
      </div>
    </section>

    <section class="admin-r-surface">
      <header class="admin-r-header">
        <div>
          <h2 class="admin-r-title">日志分类</h2>
          <p class="admin-r-subtitle">按业务域聚合。</p>
        </div>
      </header>
      <div class="admin-r-section admin-r-grid admin-r-grid--2">
        <template x-for="item in logCategoryCards()" :key="item.key">
          <div class="admin-r-card">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <div class="flex items-center gap-2">
                  <span class="h-2.5 w-2.5 rounded-full" :style="'background-color:' + item.color"></span>
                  <div class="admin-r-label" x-text="item.label"></div>
                </div>
                <p class="admin-r-hint" x-text="item.hint"></p>
              </div>
              <div class="text-2xl tabular-nums text-slate-950" x-text="item.count"></div>
            </div>
          </div>
        </template>
      </div>
    </section>
  </aside>
</div>
