<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MD Quiz Admin</title>
    <link rel="icon" type="image/png" href="/static/logo.png" />
    <link href="/static/assets/css/material-symbols.css" rel="stylesheet" />
    <link href="/static/admin.css?v=20260707-hermes-logo-crop" rel="stylesheet" />
    <script defer src="/static/assets/js/math-render.js"></script>
    <script defer src="/static/assets/js/vendor/mathjax/tex-svg.js"></script>
    <script defer src="/static/vendor/lightweight-charts/lightweight-charts.standalone.production.js"></script>
    <script type="module" src="/static/admin/app.js?v=20260707-hermes-logo-crop"></script>
    <script defer src="/static/assets/js/alpine.min.js"></script>
  </head>
  <body x-data="adminApp()" x-init="boot()" class="admin-r-document">
    <div class="admin-r-bg" aria-hidden="true"></div>
    <div x-cloak x-show="booting" class="admin-r-loading">
      <div class="admin-r-loading__panel">
        <span class="material-symbols-rounded admin-r-loading__icon">progress_activity</span>
        <span>后台正在加载</span>
      </div>
    </div>

    <main class="admin-r-root" x-cloak>
      <section x-show="!session.authenticated" x-cloak class="admin-r-login-frame">
        <div x-ref="loginMount"></div>
      </section>

      <section
        x-show="session.authenticated"
        x-cloak
        class="admin-r-shell"
        :class="isAdminSidebarCollapsed ? 'admin-r-shell--collapsed' : ''"
      >
        <aside class="admin-r-sidebar" aria-label="后台导航">
          <div class="admin-r-brand">
            <button
              type="button"
              @click="if (isAdminSidebarCollapsed) toggleAdminSidebar()"
              class="admin-r-brand__mark-button"
              :disabled="!isAdminSidebarCollapsed"
              :aria-label="isAdminSidebarCollapsed ? '展开侧边栏' : 'MD Quiz 标识'"
              :title="isAdminSidebarCollapsed ? '展开侧边栏' : 'MD Quiz'"
            >
              <img src="/static/logo.png" alt="" aria-hidden="true" class="admin-r-brand__mark" />
            </button>
            <div class="admin-r-brand__text">
              <div class="admin-r-brand__eyebrow">MD Quiz</div>
              <div class="admin-r-brand__title">后台管理</div>
            </div>
            <button
              type="button"
              @click="toggleAdminSidebar"
              class="admin-r-collapse"
              :aria-label="isAdminSidebarCollapsed ? '展开侧边栏' : '收起侧边栏'"
              :title="isAdminSidebarCollapsed ? '展开侧边栏' : '收起侧边栏'"
            >
              <span class="material-symbols-rounded" x-text="isAdminSidebarCollapsed ? 'keyboard_double_arrow_right' : 'keyboard_double_arrow_left'"></span>
            </button>
          </div>

          <nav class="admin-r-nav">
            <template x-for="item in navItems" :key="item.href">
              <button
                type="button"
                @click="go(item.href)"
                :title="item.label"
                :aria-label="item.label"
                :class="isPrimaryNavItemActive(item.href) ? 'is-active' : ''"
                class="admin-r-nav__item"
              >
                <span class="admin-r-nav__icon" aria-hidden="true">
                  <template x-if="item.iconKind === 'mcp'">
                    <svg viewBox="0 0 195 195" fill="none" class="admin-r-mcp-icon">
                      <path d="M25 97.8528L92.8823 29.9706C102.255 20.598 117.451 20.598 126.823 29.9706C136.196 39.3431 136.196 54.5391 126.823 63.9117L75.5581 115.177" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
                      <path d="M76.2653 114.47L126.823 63.9117C136.196 54.5391 151.392 54.5391 160.765 63.9117L161.118 64.2652C170.491 73.6378 170.491 88.8338 161.118 98.2063L99.7248 159.6C96.6006 162.724 96.6006 167.789 99.7248 170.913L112.331 183.52" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
                      <path d="M109.853 46.9411L59.6482 97.1457C50.2757 106.518 50.2757 121.714 59.6482 131.087C69.0208 140.459 84.2168 140.459 93.5894 131.087L143.794 80.8822" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
                    </svg>
                  </template>
                  <template x-if="item.iconKind !== 'mcp'">
                    <span class="material-symbols-rounded" x-text="item.icon"></span>
                  </template>
                </span>
                <span class="admin-r-sidebar-label" x-text="item.label"></span>
              </button>
            </template>
          </nav>
        </aside>

        <section class="admin-r-stage">
          <header class="admin-r-topbar">
            <div x-show="!routeBreadcrumbItems().length" class="admin-r-titlebar">
              <div class="admin-r-titlebar__section" x-text="route.section"></div>
              <h1 class="admin-r-titlebar__title" x-text="route.title"></h1>
            </div>
            <nav x-show="routeBreadcrumbItems().length" class="admin-r-breadcrumb" aria-label="面包屑">
              <ol class="admin-r-breadcrumb__list">
                <template x-for="(item, index) in routeBreadcrumbItems()" :key="item.href || item.label">
                  <li class="admin-r-breadcrumb__item" :class="item.current ? 'is-current' : ''">
                    <button
                      x-show="!item.current"
                      type="button"
                      @click="go(item.href)"
                      class="admin-r-breadcrumb__link"
                      x-text="item.label"
                    ></button>
                    <span
                      x-show="item.current"
                      class="admin-r-breadcrumb__current"
                      aria-current="page"
                      x-text="item.label"
                    ></span>
                    <span
                      x-show="index < routeBreadcrumbItems().length - 1"
                      class="material-symbols-rounded admin-r-breadcrumb__separator"
                      aria-hidden="true"
                    >chevron_right</span>
                  </li>
                </template>
              </ol>
            </nav>
            <div class="admin-r-topbar__meta">
              <div class="admin-r-health-pill">
                <span class="admin-r-health-pill__dot"></span>
                <span x-text="dashboardSystemLevelLabel ? dashboardSystemLevelLabel() : (statusSummary.overall_level || 'ok')"></span>
              </div>
              <div
                class="admin-r-user-menu"
                @click.outside="closeUserMenu"
                @keydown.escape.window="closeUserMenu"
              >
                <button
                  type="button"
                  @click="toggleUserMenu"
                  class="admin-r-user-menu__button"
                  aria-haspopup="menu"
                  aria-controls="admin-user-menu-panel"
                  :aria-expanded="userMenuOpen ? 'true' : 'false'"
                >
                  <span class="material-symbols-rounded admin-r-user-menu__avatar" aria-hidden="true">account_circle</span>
                  <span class="admin-r-user-menu__text">
                    <span class="admin-r-user-menu__label">用户</span>
                    <span class="admin-r-user-name" x-text="session.username || 'admin'"></span>
                  </span>
                  <span class="material-symbols-rounded admin-r-user-menu__chevron" aria-hidden="true" x-text="userMenuOpen ? 'expand_less' : 'expand_more'"></span>
                </button>
                <div
                  id="admin-user-menu-panel"
                  x-show="userMenuOpen"
                  x-cloak
                  x-transition
                  class="admin-r-user-menu__panel"
                  role="menu"
                  aria-label="个人中心菜单"
                >
                  <div class="admin-r-user-menu__header" role="none">
                    <span class="admin-r-user-menu__eyebrow">个人中心</span>
                    <span class="admin-r-user-menu__account" x-text="session.username || 'admin'"></span>
                  </div>
                  <button
                    type="button"
                    @click="logout"
                    class="admin-r-user-menu__item admin-r-user-menu__item--danger"
                    role="menuitem"
                  >
                    <span class="material-symbols-rounded" aria-hidden="true">logout</span>
                    <span>退出登录</span>
                  </button>
                </div>
              </div>
            </div>
          </header>

          <div x-show="isAdminCompactLayout" x-cloak class="admin-r-mobile-nav">
            <div
              class="admin-r-mobile-nav__track"
              role="navigation"
              aria-label="后台主导航"
              :style="{ '--admin-mobile-nav-count': navItems.length }"
            >
              <template x-for="item in navItems" :key="'compact-' + item.href">
                <button
                  type="button"
                  @click="go(item.href)"
                  :aria-label="item.label"
                  :title="item.label"
                  :class="isPrimaryNavItemActive(item.href) ? 'is-active' : ''"
                  class="admin-r-mobile-nav__item"
                >
                  <template x-if="item.iconKind === 'mcp'">
                    <svg viewBox="0 0 195 195" aria-hidden="true" fill="none" class="admin-r-mcp-icon">
                      <path d="M25 97.8528L92.8823 29.9706C102.255 20.598 117.451 20.598 126.823 29.9706C136.196 39.3431 136.196 54.5391 126.823 63.9117L75.5581 115.177" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
                      <path d="M76.2653 114.47L126.823 63.9117C136.196 54.5391 151.392 54.5391 160.765 63.9117L161.118 64.2652C170.491 73.6378 170.491 88.8338 161.118 98.2063L99.7248 159.6C96.6006 162.724 96.6006 167.789 99.7248 170.913L112.331 183.52" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
                      <path d="M109.853 46.9411L59.6482 97.1457C50.2757 106.518 50.2757 121.714 59.6482 131.087C69.0208 140.459 84.2168 140.459 93.5894 131.087L143.794 80.8822" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
                    </svg>
                  </template>
                  <template x-if="item.iconKind !== 'mcp'">
                    <span class="material-symbols-rounded" x-text="item.icon"></span>
                  </template>
                  <span
                    class="admin-r-mobile-nav__label"
                    x-text="({ '邀约与答题': '邀约', '系统日志': '日志', '系统状态': '状态' }[item.label] || item.label)"
                  ></span>
                </button>
              </template>
            </div>
          </div>

          <div class="admin-r-page-mount" x-ref="pageMount"></div>

          <div x-show="(notices || []).length" class="admin-r-notices">
            <template x-for="item in notices" :key="item.id">
              <div class="admin-r-notice" x-text="item.message"></div>
            </template>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
